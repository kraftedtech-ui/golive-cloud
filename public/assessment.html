<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoLive — Operations Coordinator Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-lt:#E1F5EE;--teal-mid:#9FE1CB;
  --navy:#0D2233;--amber:#B85042;--amber-lt:#FFF8F6;
  --slate:#1E293B;--mid:#475569;--muted:#94A3B8;
  --gray:#F4F7FB;--border:#E2E8F0;--white:#FFFFFF;
  --success-bg:#EAF3DE;--success:#3B6D11;
  --danger-bg:#FCEBEB;--danger:#A32D2D;
  --warning-bg:#FAEEDA;--warning:#854F0B;
  --accent-bg:#E6F1FB;--accent:#185FA5;
}
body{font-family:'Inter',sans-serif;background:#F8FAFC;color:var(--slate);min-height:100vh;padding:0}
#wrap{max-width:660px;margin:0 auto;padding:2rem 1rem 4rem}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.logo-mark{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600}
.logo-text{font-size:14px;font-weight:500;color:var(--slate)}
.logo-sub{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.badge{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ba{background:var(--accent-bg);color:var(--accent)}
.bs{background:var(--success-bg);color:var(--success)}
.bd{background:var(--danger-bg);color:var(--danger)}
.bw{background:var(--warning-bg);color:var(--warning)}
.hbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.25rem}
.timer-box{display:flex;align-items:center;gap:8px;background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:7px 12px}
.timer-val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--slate)}
.timer-val.warn{color:var(--warning)}
.timer-val.danger{color:var(--danger)}
.cam-wrap{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cam-box{width:150px;height:112px;border-radius:10px;overflow:hidden;border:2px solid var(--teal);background:#000;position:relative;box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.cam-box video{width:100%;height:100%;object-fit:cover}
.cam-rec{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:#e53535;animation:blink 1s infinite}
.cam-lbl{font-size:10px;color:var(--muted)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.prog{height:3px;background:var(--gray);border-radius:2px;margin-bottom:1.25rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width 0.3s}
.q-text{font-size:15px;font-weight:500;color:var(--slate);line-height:1.65;margin-bottom:6px}
.q-sub{font-size:12px;color:var(--mid);line-height:1.6;margin-bottom:1rem}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:7px;background:#fff;transition:all 0.12s;user-select:none}
.opt:hover{border-color:var(--teal);background:var(--teal-lt)}
.opt.sel{border-color:var(--teal);background:var(--teal-lt)}
.opt input{margin-top:2px;flex-shrink:0;accent-color:var(--teal)}
.opt-text{font-size:13px;color:var(--slate);line-height:1.5}
textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--slate);background:#fff;resize:vertical;font-family:'Inter',sans-serif;line-height:1.5}
textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,110,86,0.1)}
.tf-row{display:flex;gap:8px}
.tf-btn{flex:1;padding:11px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;background:#fff;color:var(--slate);transition:all 0.12s;font-family:'Inter',sans-serif}
.tf-btn:hover{border-color:var(--teal);background:var(--teal-lt)}
.tf-btn.sel{border-color:var(--teal);background:var(--teal-lt);color:var(--teal)}
.nav{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid var(--border);margin-top:1.25rem}
button{padding:9px 18px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;background:#fff;color:var(--slate);transition:all 0.12s}
button:hover{background:var(--gray)}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
button.primary:hover{background:#0a5a45}
button:disabled{opacity:0.35;cursor:not-allowed}
.err{font-size:12px;color:var(--danger);margin-top:6px;min-height:18px}
.vlog{max-height:120px;overflow-y:auto;background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;font-family:monospace;color:var(--mid);line-height:1.7}
.gate-icon{font-size:40px;text-align:center;margin-bottom:1rem;color:var(--teal)}
.chklist{list-style:none;margin:1rem 0}
.chklist li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--mid);padding:5px 0;line-height:1.5}
.chklist li i{color:var(--teal);margin-top:1px;flex-shrink:0}
.result-score{font-size:52px;font-weight:600;color:var(--slate);text-align:center;margin-bottom:4px}
.result-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:1rem}
.brow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.brow:last-child{border:none}
.brow-l{color:var(--mid)}
.brow-r{font-weight:600}
.brow-r.good{color:var(--success)}
.brow-r.ok{color:var(--warning)}
.brow-r.low{color:var(--danger)}
.q-rev{background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.q-rev-q{font-size:12px;font-weight:500;color:var(--slate);margin-bottom:4px}
.q-rev-a{font-size:12px;color:var(--mid);line-height:1.5}
.q-rev-a.c{color:var(--success)}
.q-rev-a.w{color:var(--danger)}
.integrity-box{background:var(--danger-bg);border:1px solid #f09595;border-left:4px solid var(--danger);border-radius:8px;padding:14px;margin-bottom:1rem}
.integrity-box p{font-size:13px;color:var(--danger);line-height:1.6}
.warn-banner{background:var(--warning-bg);border:1px solid #FAC775;border-left:4px solid var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--warning);display:none}
.warn-banner.show{display:block}
.sec-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin:1.25rem 0 0.75rem;padding-bottom:6px;border-bottom:1px solid var(--border)}
.preview-vid{width:220px;height:165px;border-radius:10px;border:2px solid var(--teal);background:#000;display:block;margin:0 auto 12px;object-fit:cover}
h2.page-title{font-size:20px;font-weight:600;color:var(--slate);margin-bottom:6px}
.page-sub{font-size:13px;color:var(--mid);line-height:1.6}
.info-row{display:flex;gap:8px;flex-wrap:wrap;margin:1rem 0}
.info-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mid);background:var(--gray);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
</style>
</head>
<body>
<div id="wrap">
  <div class="logo">
    <img src="/images/logo-dark.png" alt="GoLive Digital Solutions" style="height:120px;object-fit:contain">
  </div>
  <div id="app"></div>
</div>

<script>
const QUESTIONS=[
  {id:'q1',sec:'Section A — Administrative skills',type:'mcq',
   text:'You receive three tasks simultaneously: 1) a vendor awaits a signed contract, 2) the MD needs meeting notes sent within the hour, 3) a new team member needs their email account set up. How do you prioritise?',
   opts:['Set up the email account first — it is the most technical task','Send meeting notes first (fixed deadline), then contract, then email setup','Ask the MD to decide priority','Do all three at the same time to save time'],
   correct:1,explain:'Meeting notes have a defined 1-hour deadline. The contract is second. Email setup is routine and can wait. Spotting the fixed deadline and working backwards from it is the key skill.'},
  {id:'q2',sec:'Section A — Administrative skills',type:'mcq',
   text:'A vendor emails about an unpaid 30-day invoice. The MD is in a meeting. You find the invoice was never forwarded internally. What do you do?',
   opts:['Forward to accounts and update the vendor that payment is being processed','Wait for the MD before taking any action','Tell the vendor it is not your responsibility','Delete and re-send the email'],
   correct:0,explain:'Forwarding an internal document and giving the vendor a factual update is within the coordinator\'s authority. Waiting is not productive.'},
  {id:'q3',sec:'Section A — Administrative skills',type:'tf',
   text:'An Operations Coordinator can sign contracts on behalf of the company if the MD is unavailable and the deadline is urgent.',
   correct:'False',explain:'Signing authority must be formally delegated in writing. Without delegation, a coordinator cannot sign binding documents regardless of urgency.'},
  {id:'q4',sec:'Section B — Microsoft 365 & Digital tools',type:'mcq',
   text:'You need to share a 25MB file with an external partner but the email limit is 20MB. What is the best Microsoft 365 solution?',
   opts:['Ask the partner to create a WeTransfer account','Upload the file to OneDrive and share a link','Compress with WinRAR and retry','Split into two separate emails'],
   correct:1,explain:'OneDrive sharing is the correct Microsoft 365 answer — secure, traceable, and requires no third-party tools.'},
  {id:'q5',sec:'Section B — Microsoft 365 & Digital tools',type:'mcq',
   text:'A meeting is scheduled for 3pm Lagos time (WAT). EST is 6 hours behind WAT. What time do you tell the Indianapolis participants?',
   opts:['9am EST','9pm EST','3pm EST','6am EST'],
   correct:0,explain:'3pm WAT minus 6 hours = 9am EST. This matters for coordinating GoLive\'s Nigeria and US operations.'},
  {id:'q6',sec:'Section B — Microsoft 365 & Digital tools',type:'mcq',
   text:'Which Microsoft 365 app is best for tracking vendor contracts with renewal dates, values, and status?',
   opts:['Microsoft Word','Microsoft PowerPoint','Microsoft Excel','Microsoft Teams'],
   correct:2,explain:'Excel is correct for structured tabular data with sortable and filterable fields.'},
  {id:'q7',sec:'Section C — Professional judgement',type:'mcq',
   text:'While writing meeting minutes you notice a decision was made that you personally disagree with. What do you do?',
   opts:['Leave it out of the minutes','Record it accurately in the minutes as decided','Add a personal note of disagreement','Tell a colleague before circulating'],
   correct:1,explain:'Minutes are a factual record, not personal commentary. Record what was decided accurately.'},
  {id:'q8',sec:'Section C — Professional judgement',type:'mcq',
   text:'A colleague asks for another staff member\'s salary details, saying it is "just between us." You have access to this information. What do you do?',
   opts:['Share since you trust the colleague','Decline — HR information is confidential','Check with the MD first','Share only if they promise not to tell anyone'],
   correct:1,explain:'Confidentiality is non-negotiable. Access to information does not equal permission to share it.'},
  {id:'q9',sec:'Section C — Professional judgement',type:'tf',
   text:'If a task is not specifically listed in your job description, it is acceptable to decline to do it.',
   correct:'False',explain:'Job descriptions outline core responsibilities but are not exhaustive. Flexibility is expected, especially in an early-stage company.'},
  {id:'q10',sec:'Section D — Written communication',type:'text',
   text:'Draft a short professional email (3–5 sentences) to a vendor called Apex Supplies Ltd, informing them that your company will not be renewing a contract expiring at the end of this month.',
   sub:'Write clearly, politely, and professionally. This will be reviewed by the interviewer.',
   placeholder:'Dear Apex Supplies Ltd...'},
  {id:'q11',sec:'Section D — Written communication',type:'text',
   text:'A new team member, John, is starting on Monday. Write a short internal message (3 sentences) to notify existing staff.',
   sub:'Write clearly and professionally. This will be reviewed by the interviewer.',
   placeholder:'Hi team...'},
  {id:'q12',sec:'Section E — Situation handling',type:'mcq',
   text:'You are alone in the office when someone arrives claiming to be a CAC inspector and demands company registration documents immediately. What do you do?',
   opts:['Hand over all documents to avoid trouble','Ask for official ID, note their name and badge number, and call the MD before providing any documents','Say the MD is unavailable and ask them to return another day','Give documents and call the MD afterwards'],
   correct:1,explain:'Verify identity before releasing company documents. A legitimate inspector will understand a brief verification pause.'},
  {id:'q13',sec:'Section E — Situation handling',type:'mcq',
   text:'You notice a recurring office supply invoice charged 20% above the agreed contract rate. What is your first step?',
   opts:['Pay it and mention it to the MD next week','Contact the vendor about the discrepancy before the invoice is paid','Approve it since the amount is not large','Assume the contract rate has been updated'],
   correct:1,explain:'Flag the discrepancy to the vendor before payment. This is exactly the kind of detail the Operations Coordinator role exists to catch.'},
  {id:'q14',sec:'Section E — Situation handling',type:'tf',
   text:'If you are unsure whether a task is within your authority, the best approach is to attempt it and explain afterwards if something goes wrong.',
   correct:'False',explain:'When uncertain about authority, ask before acting. Acting outside authority on contracts or financial matters can have irreversible consequences.'},
  {id:'q15',sec:'Section F — Reasoning',type:'mcq',
   text:'You receive simultaneous "urgent" requests from GoLive Forge (book a meeting room) and B2B Services (prepare a vendor proposal). How do you handle it?',
   opts:['Complete the B2B request first — it is client-facing','Ask each team which deadline is actually fixed versus which is perceived urgency, then sequence accordingly','Flip a coin since both are equally important','Tell both teams you cannot help simultaneously and ask them to resubmit tomorrow'],
   correct:1,explain:'Asking about actual vs. perceived urgency is the correct operational response. The coordinator\'s job is to triage effectively.'},
]

const TOTAL=30*60
let st={phase:'code-gate',codeVerified:false,consentGiven:false,candidateName:'',candidateEmail:'',candidateRole:'',appRef:'',camGranted:false,stream:null,recorder:null,chunks:[],recBlob:null,violations:[],tabSwitches:0,pasteTries:0,current:0,answers:{},textAnswers:{},secs:TOTAL,timerInterval:null}

function logV(msg){const t=new Date().toLocaleTimeString();st.violations.push(`[${t}] ${msg}`)}
function fmt(s){const m=Math.floor(s/60),ss=s%60;return `${m}:${ss.toString().padStart(2,'0')}`}
function scoreFor(q,ans){if(q.type==='mcq')return ans===q.correct?1:0;if(q.type==='tf')return ans===q.correct?1:0;return null}
function calcScores(){let got=0,max=0;QUESTIONS.forEach(q=>{if(q.type!=='text'){max++;if(st.answers[q.id]!==undefined)got+=scoreFor(q,st.answers[q.id])}});return{got,max}}
function sectionScores(){const s={};QUESTIONS.forEach(q=>{if(q.type==='text')return;const k=q.sec.match(/Section ([A-Z])/)[1];if(!s[k])s[k]={g:0,m:0};s[k].m++;if(st.answers[q.id]!==undefined&&scoreFor(q,st.answers[q.id])===1)s[k].g++});return s}

function render(){document.getElementById('app').innerHTML=renderPhase();attach()}

function renderPhase(){
  if(st.phase==='code-gate')return renderCodeGate()
  if(st.phase==='consent')return renderConsent()
  if(st.phase==='declined')return renderDeclined()
  if(st.phase==='save-later')return renderSaveLater()
  if(st.phase==='intake')return renderIntake()
  if(st.phase==='ref-confirm')return renderRefConfirm()
  if(st.phase==='gate')return renderGate()
  if(st.phase==='confirm')return renderConfirm()
  if(st.phase==='quiz')return renderQuiz()
  return renderResult()
}

function renderCodeGate(){return `
<div style="text-align:center;padding:1rem 0 1.5rem">
  <h2 class="page-title">GoLive Careers</h2>
  <p class="page-sub" style="max-width:400px;margin:0 auto 1.5rem">This assessment is by invitation only. Enter the access code sent to you by the GoLive LinkedIn page to continue.</p>
</div>
<div class="card">
  <div style="margin-bottom:1rem">
    <label style="display:block;font-size:13px;font-weight:500;color:var(--slate);margin-bottom:5px">Role applying for <span style="color:var(--danger)">*</span></label>
    <select id="cg-role" disabled style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;color:var(--slate);background:#fff" onchange="document.getElementById('cg-err').textContent=''">
      <option value="Operations Coordinator" selected>Operations Coordinator</option>
    </select>
  </div>
  <div style="margin-bottom:0.5rem">
    <label style="display:block;font-size:13px;font-weight:500;color:var(--slate);margin-bottom:5px">Access code <span style="color:var(--danger)">*</span></label>
    <input type="text" id="cg-code" placeholder="Enter your access code" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;color:var(--slate);background:#fff;letter-spacing:0.1em;text-transform:uppercase" oninput="this.value=this.value.toUpperCase();document.getElementById('cg-err').textContent=''">
  </div>
  <p style="font-size:11px;color:var(--muted);margin-top:6px">Don't have a code? Message the <a href="https://www.linkedin.com/company/51717921" target="_blank" style="color:var(--teal);text-decoration:none;font-weight:500">GoLive LinkedIn page</a> expressing your interest.</p>
</div>
<div class="err" id="cg-err" style="margin-bottom:10px"></div>
<button class="primary" id="cg-btn" onclick="verifyCode()"><i class="ti ti-arrow-right"></i> Verify access code</button>`}

async function verifyCode(){
  const role=document.getElementById('cg-role').value
  const code=document.getElementById('cg-code').value.trim()
  const err=document.getElementById('cg-err')
  const btn=document.getElementById('cg-btn')
  if(!role){err.textContent='Please select the role you are applying for.';return}
  if(!code){err.textContent='Please enter your access code.';return}
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> Verifying...'}
  try{
    const res=await fetch('/api/assessments/verify-code',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code,role})
    })
    const data=await res.json()
    if(data.valid){
      st.codeVerified=true
      st.candidateRole=role
      st.phase='consent'
      render()
    }else{
      err.textContent=data.message||'Invalid access code.'
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-arrow-right"></i> Verify access code'}
    }
  }catch(e){
    err.textContent='Verification failed. Please try again.'
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-arrow-right"></i> Verify access code'}
  }
}

function renderConsent(){return `
<div style="margin-bottom:1.5rem">
  <p style="font-size:11px;font-weight:600;color:var(--teal);letter-spacing:0.1em;margin-bottom:4px">BEFORE YOU BEGIN</p>
  <h2 class="page-title" style="font-size:22px">Assessment terms &amp; conditions</h2>
  <p class="page-sub">Please read carefully. You must accept these terms before proceeding.</p>
</div>

<div class="card" style="border-left:4px solid var(--danger);background:#FFFBFB">
  <p style="font-size:13px;font-weight:600;color:var(--danger);margin-bottom:10px;display:flex;align-items:center;gap:6px"><i class="ti ti-video"></i> Session recording</p>
  <p style="font-size:13px;color:var(--slate);line-height:1.7;margin-bottom:0">Your camera will be active and your full session will be recorded from the moment you begin until submission. This recording is reviewed by the GoLive hiring team as part of the assessment process. By proceeding you consent to being recorded. You must remain visible on camera at all times during the assessment.</p>
</div>

<div class="card" style="margin-top:0.75rem;border-left:4px solid var(--amber)">
  <p style="font-size:13px;font-weight:600;color:var(--warning);margin-bottom:10px;display:flex;align-items:center;gap:6px"><i class="ti ti-shield-exclamation"></i> Integrity monitoring — the following will be detected and logged</p>
  <div style="display:flex;flex-direction:column;gap:8px">
    ${[
      ['Tab switching','Navigating away from this page or switching to another browser tab will be detected and timestamped. Each instance is logged as a violation.'],
      ['Window focus loss','Clicking outside the assessment window — including switching to another application — is logged.'],
      ['Copy & paste','All paste attempts are blocked. Keyboard shortcuts including Ctrl+C, Ctrl+V, Ctrl+U, Ctrl+F and right-click are disabled.'],
      ['External assistance','The use of AI tools, search engines, reference materials, or assistance from another person is strictly prohibited. This constitutes academic dishonesty and will result in immediate disqualification.'],
      ['One attempt only','You are permitted one attempt at this assessment per role. A second attempt using the same email address will be automatically blocked.'],
    ].map(([t,d])=>`
      <div style="display:flex;gap:10px;align-items:flex-start">
        <i class="ti ti-circle-x" style="color:var(--danger);flex-shrink:0;margin-top:1px"></i>
        <div><p style="font-size:13px;font-weight:500;color:var(--slate);margin-bottom:2px">${t}</p><p style="font-size:12px;color:var(--mid);line-height:1.5">${d}</p></div>
      </div>`).join('')}
  </div>
</div>

<div class="card" style="margin-top:0.75rem;border-left:4px solid var(--teal);background:#FAFFFE">
  <p style="font-size:13px;font-weight:600;color:var(--teal);margin-bottom:10px;display:flex;align-items:center;gap:6px"><i class="ti ti-info-circle"></i> Assessment details</p>
  <div style="display:flex;flex-direction:column;gap:6px">
    ${[
      ['Duration','30 minutes — the timer begins immediately when you click Begin assessment.'],
      ['Format','15 questions — multiple choice, true/false, and two short written answers.'],
      ['Device','Laptop or desktop required. Camera must be working before you proceed.'],
      ['Environment','Complete the assessment in a quiet location. Ensure stable internet connection.'],
      ['Results','Your score and session recording are securely uploaded to GoLive after submission.'],
    ].map(([t,d])=>`
      <div style="display:flex;gap:10px;align-items:flex-start">
        <i class="ti ti-check" style="color:var(--teal);flex-shrink:0;margin-top:1px"></i>
        <p style="font-size:12px;color:var(--mid);line-height:1.5"><span style="font-weight:500;color:var(--slate)">${t}: </span>${d}</p>
      </div>`).join('')}
  </div>
</div>

<div style="background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:0.75rem;margin-bottom:1.25rem">
  <p style="font-size:12px;color:var(--mid);line-height:1.6;text-align:center">By clicking <strong>Accept &amp; Continue</strong> you confirm that you have read and understood these terms, you consent to being recorded, and you agree to complete this assessment independently without any external assistance.</p>
</div>

async function submitIntake(){
  const name=document.getElementById('inp-name').value.trim()
  const email=document.getElementById('inp-email').value.trim()
  const role=document.getElementById('inp-role').value
  const err=document.getElementById('intake-err')
  const btn=document.getElementById('intake-btn')
  if(!name){err.textContent='Please enter your full name.';return}
  if(!email||!email.includes('@')){err.textContent='Please enter a valid email address.';return}
  if(!role){err.textContent='Please select the role you are applying for.';return}
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> Registering application...'}
  try{
    const res=await fetch('/api/applications/register',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-upload-token':'golive-assessment-2026'},
      body:JSON.stringify({name,email,role})
    })
    const data=await res.json()
    if(!data.allowed){
      err.textContent=data.message||'You have already applied for this role. Only one application is permitted.'
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-arrow-right"></i> Continue to camera verification'}
      return
    }
    st.candidateName=name
    st.candidateEmail=email
    st.candidateRole=role
    st.appRef=data.ref
    st.phase='ref-confirm'
    render()
  }catch(e){
    console.warn('Registration failed, allowing through',e)
    st.candidateName=name
    st.candidateEmail=email
    st.candidateRole=role
    st.phase='gate'
    render()
  }
}

function attach(){
  if(st.phase==='confirm'){const v=document.getElementById('preview-vid');if(v&&st.stream)v.srcObject=st.stream}
  if(st.phase==='quiz'){clearInterval(st.timerInterval);st.timerInterval=setInterval(()=>{st.secs--;const d=document.getElementById('tmr');if(d){d.textContent=fmt(st.secs);d.className='timer-val'+(st.secs<120?' danger':st.secs<300?' warn':'')}if(st.secs<=0){clearInterval(st.timerInterval);stopRec();st.phase='result';render()}},1000);injectCam()}
}

function injectCam(){
  if(document.querySelector('.cam-wrap'))return
  const cw=document.createElement('div')
  cw.className='cam-wrap'
  cw.innerHTML=`<div class="cam-box"><video id="live-cam" autoplay muted playsinline></video><div class="cam-rec"></div></div><span class="cam-lbl">Recording in progress</span>`
  document.body.appendChild(cw)
  const lv=document.getElementById('live-cam')
  if(lv&&st.stream)lv.srcObject=st.stream
}

async function requestCam(){
  const err=document.getElementById('cam-err')
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false})
    st.stream=s;st.camGranted=true;st.phase='confirm';render()
  }catch(e){if(err)err.textContent='Camera access denied. You must grant camera permission to proceed with this assessment.'}
}

function startTest(){
  st.phase='quiz';startRec();setupAntiCheat();render()
}

function startRec(){
  if(!st.stream)return
  try{
    const mr=new MediaRecorder(st.stream,{mimeType:'video/webm;codecs=vp9'})
    mr.ondataavailable=e=>{if(e.data&&e.data.size>0)st.chunks.push(e.data)}
    mr.onstop=()=>{st.recBlob=new Blob(st.chunks,{type:'video/webm'})}
    mr.start(1000);st.recorder=mr
  }catch(e){
    try{const mr=new MediaRecorder(st.stream);mr.ondataavailable=e=>{if(e.data&&e.data.size>0)st.chunks.push(e.data)};mr.onstop=()=>{st.recBlob=new Blob(st.chunks,{type:'video/webm'})};mr.start(1000);st.recorder=mr}catch(e2){logV('Recording not supported in this browser')}
  }
}

function stopRec(){
  if(st.recorder&&st.recorder.state!=='inactive')try{st.recorder.stop()}catch(e){}
  if(st.stream)st.stream.getTracks().forEach(t=>t.stop())
  const cw=document.querySelector('.cam-wrap');if(cw)cw.remove()
}

function setupAntiCheat(){
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&st.phase==='quiz'){st.tabSwitches++;logV(`Tab/window hidden (total: ${st.tabSwitches})`);const wb=document.getElementById('wb');if(wb){wb.classList.add('show');wb.innerHTML=`<i class="ti ti-alert-triangle"></i> Tab switch detected (${st.tabSwitches}× flagged). All violations are recorded.`}}})
  window.addEventListener('blur',()=>{if(st.phase==='quiz')logV('Window lost focus')})
  document.addEventListener('paste',e=>{if(st.phase==='quiz'){e.preventDefault();st.pasteTries++;logV(`Paste attempt blocked (total: ${st.pasteTries})`);const wb=document.getElementById('wb');if(wb){wb.classList.add('show');wb.innerHTML=`<i class="ti ti-alert-triangle"></i> Paste blocked (${st.pasteTries}× detected). All violations are recorded.`}}})
  document.addEventListener('contextmenu',e=>{if(st.phase==='quiz')e.preventDefault()})
  document.addEventListener('keydown',e=>{if(st.phase!=='quiz')return;if((e.ctrlKey||e.metaKey)&&['c','v','u','s','a','p','f'].includes(e.key.toLowerCase())){e.preventDefault();if(e.key.toLowerCase()==='v'){st.pasteTries++;logV(`Paste shortcut blocked (total: ${st.pasteTries})`)}else{logV(`Shortcut blocked: Ctrl+${e.key.toUpperCase()}`)}}})
}

function pick(id,i){st.answers[id]=i;render()}
function pickTF(id,v){st.answers[id]=v;render()}
function saveTA(id){const el=document.getElementById('ta_'+id);if(el)st.textAnswers[id]=el.value}

function nxt(){
  const q=QUESTIONS[st.current]
  if(q.type==='text'){const el=document.getElementById('ta_'+q.id);if(el)st.textAnswers[q.id]=el.value}
  const ok=q.type==='text'?(st.textAnswers[q.id]||'').trim().length>0:st.answers[q.id]!==undefined
  if(!ok){const e=document.getElementById('qerr');if(e)e.textContent=q.type==='text'?'Enter a response before continuing.':'Select an answer before continuing.';return}
  st.current++;render()
}

function prev(){
  const q=QUESTIONS[st.current]
  if(q.type==='text'){const el=document.getElementById('ta_'+q.id);if(el)st.textAnswers[q.id]=el.value}
  st.current--;render()
}

function finish(){
  const q=QUESTIONS[st.current]
  if(q.type==='text'){const el=document.getElementById('ta_'+q.id);if(el)st.textAnswers[q.id]=el.value}
  const ok=q.type==='text'?(st.textAnswers[q.id]||'').trim().length>0:st.answers[q.id]!==undefined
  if(!ok){const e=document.getElementById('qerr');if(e)e.textContent=q.type==='text'?'Enter a response before submitting.':'Select an answer before submitting.';return}
  clearInterval(st.timerInterval);stopRec();setTimeout(()=>{st.phase='result';render();setTimeout(()=>uploadRec(),1000)},600)
}

async function uploadRec(){
  if(!st.recBlob)return
  const btn=document.getElementById('upload-btn')
  const status=document.getElementById('upload-status')
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> Uploading...'}
  try{
    const fd=new FormData()
    fd.append('recording',new File([st.recBlob],'recording.webm',{type:'video/webm'}))
    fd.append('candidate',st.candidateName)
    fd.append('ref',st.appRef||'')
    fd.append('email',st.candidateEmail)
    fd.append('role',st.candidateRole)
    // Build full transcript
    const transcript = QUESTIONS.map((q,i) => {
      const ans = st.answers[q.id]
      const textAns = st.textAnswers[q.id] || ''
      const correct = q.type === 'text' ? null : scoreFor(q, ans) === 1
      return {
        number: i + 1,
        section: q.sec,
        type: q.type,
        question: q.text,
        answer: q.type === 'mcq' ? (ans !== undefined ? q.opts[ans] : 'No answer') :
                q.type === 'tf' ? (ans || 'No answer') : textAns,
        correct,
        correctAnswer: q.type === 'mcq' ? q.opts[q.correct] :
                       q.type === 'tf' ? q.correct : null,
        explanation: q.explain || null,
      }
    })
    fd.append('transcript', JSON.stringify(transcript))
    fd.append('violations', JSON.stringify(st.violations))
    fd.append('tabSwitches', String(st.tabSwitches))
    fd.append('pasteTries', String(st.pasteTries))
    const {got,max}=calcScores()
    fd.append('score',got+'-'+max)
    const res=await fetch('/api/save-recording',{method:'POST',headers:{'x-upload-token':'golive-assessment-2026'},body:fd})
    const data=await res.json()
    if(data.success){
      if(status){status.textContent='Recording saved to server successfully.';status.style.color='var(--success)'}
      if(btn){btn.innerHTML='<i class="ti ti-check"></i> Saved to server';btn.style.background='var(--success-bg)';btn.style.color='var(--success)';btn.style.borderColor='#c0dd97'}
    }else{throw new Error(data.error)}
  }catch(e){
    if(status){status.textContent='Upload failed — downloading file instead.';status.style.color='var(--danger)'}
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> Retry upload'}
    downloadRec()
  }
}

async function uploadRec(){
  if(!st.recBlob)return
  const btn=document.getElementById('upload-btn')
  const status=document.getElementById('upload-status')
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> Uploading...'}
  try{
    const fd=new FormData()
    fd.append('recording',new File([st.recBlob],'recording.webm',{type:'video/webm'}))
    fd.append('candidate',st.candidateName)
    fd.append('ref',st.appRef||'')
    fd.append('email',st.candidateEmail)
    fd.append('role',st.candidateRole)
    // Build full transcript
    const transcript = QUESTIONS.map((q,i) => {
      const ans = st.answers[q.id]
      const textAns = st.textAnswers[q.id] || ''
      const correct = q.type === 'text' ? null : scoreFor(q, ans) === 1
      return {
        number: i + 1,
        section: q.sec,
        type: q.type,
        question: q.text,
        answer: q.type === 'mcq' ? (ans !== undefined ? q.opts[ans] : 'No answer') :
                q.type === 'tf' ? (ans || 'No answer') : textAns,
        correct,
        correctAnswer: q.type === 'mcq' ? q.opts[q.correct] :
                       q.type === 'tf' ? q.correct : null,
        explanation: q.explain || null,
      }
    })
    fd.append('transcript', JSON.stringify(transcript))
    fd.append('violations', JSON.stringify(st.violations))
    fd.append('tabSwitches', String(st.tabSwitches))
    fd.append('pasteTries', String(st.pasteTries))
    const {got,max}=calcScores()
    fd.append('score',got+'-'+max)
    const res=await fetch('/api/save-recording',{method:'POST',headers:{'x-upload-token':'golive-assessment-2026'},body:fd})
    const data=await res.json()
    if(data.success){
      if(status){status.textContent='Recording saved to server successfully.';status.style.color='var(--success)'}
      if(btn){btn.innerHTML='<i class="ti ti-check"></i> Saved to server';btn.style.background='var(--success-bg)';btn.style.color='var(--success)';btn.style.borderColor='#c0dd97'}
    }else{throw new Error(data.error)}
  }catch(e){
    if(status){status.textContent='Upload failed — downloading file instead.';status.style.color='var(--danger)'}
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> Retry upload'}
    downloadRec()
  }
}

function downloadRec(){
  if(!st.recBlob)return
  const url=URL.createObjectURL(st.recBlob)
  const a=document.createElement('a')
  a.href=url
  a.download=`GoLive_Assessment_${new Date().toISOString().slice(0,10)}.webm`
  a.click()
  URL.revokeObjectURL(url)
}

render()
</script>
