<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoLive — Hosting Support Technician Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-lt:#E1F5EE;--teal-mid:#9FE1CB;
  --navy:#0D2233;--amber:#B85042;--amber-lt:#FFF8F6;
  --slate:#1E293B;--mid:#475569;--muted:#94A3B8;
  --gray:#F4F7FB;--border:#E2E8F0;--white:#FFFFFF;
  --success-bg:#EAF3DE;--success:#3B6D11;
  --danger-bg:#FCEBEB;--danger:#A32D2D;
  --warning-bg:#FAEEDA;--warning:#854F0B;
  --accent-bg:#E6F1FB;--accent:#185FA5;
}
body{font-family:'Inter',sans-serif;background:#F8FAFC;color:var(--slate);min-height:100vh;padding:0}
#wrap{max-width:660px;margin:0 auto;padding:2rem 1rem 4rem}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.logo-mark{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600}
.logo-text{font-size:14px;font-weight:500;color:var(--slate)}
.logo-sub{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.badge{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ba{background:var(--accent-bg);color:var(--accent)}
.bs{background:var(--success-bg);color:var(--success)}
.bd{background:var(--danger-bg);color:var(--danger)}
.bw{background:var(--warning-bg);color:var(--warning)}
.hbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.25rem}
.timer-box{display:flex;align-items:center;gap:8px;background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:7px 12px}
.timer-val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--slate)}
.timer-val.warn{color:var(--warning)}
.timer-val.danger{color:var(--danger)}
.cam-wrap{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cam-box{width:150px;height:112px;border-radius:10px;overflow:hidden;border:2px solid var(--teal);background:#000;position:relative;box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.cam-box video{width:100%;height:100%;object-fit:cover}
.cam-rec{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:#e53535;animation:blink 1s infinite}
.cam-lbl{font-size:10px;color:var(--muted)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.prog{height:3px;background:var(--gray);border-radius:2px;margin-bottom:1.25rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width 0.3s}
.q-text{font-size:15px;font-weight:500;color:var(--slate);line-height:1.65;margin-bottom:6px}
.q-sub{font-size:12px;color:var(--mid);line-height:1.6;margin-bottom:1rem}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:7px;background:#fff;transition:all 0.12s;user-select:none}
.opt:hover{border-color:var(--teal);background:var(--teal-lt)}
.opt.sel{border-color:var(--teal);background:var(--teal-lt)}
.opt input{margin-top:2px;flex-shrink:0;accent-color:var(--teal)}
.opt-text{font-size:13px;color:var(--slate);line-height:1.5}
textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--slate);background:#fff;resize:vertical;font-family:'Inter',sans-serif;line-height:1.5}
textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,110,86,0.1)}
.tf-row{display:flex;gap:8px}
.tf-btn{flex:1;padding:11px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;background:#fff;color:var(--slate);transition:all 0.12s;font-family:'Inter',sans-serif}
.tf-btn:hover{border-color:var(--teal);background:var(--teal-lt)}
.tf-btn.sel{border-color:var(--teal);background:var(--teal-lt);color:var(--teal)}
.nav{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid var(--border);margin-top:1.25rem}
button{padding:9px 18px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;background:#fff;color:var(--slate);transition:all 0.12s}
button:hover{background:var(--gray)}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
button.primary:hover{background:#0a5a45}
button:disabled{opacity:0.35;cursor:not-allowed}
.err{font-size:12px;color:var(--danger);margin-top:6px;min-height:18px}
.vlog{max-height:120px;overflow-y:auto;background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;font-family:monospace;color:var(--mid);line-height:1.7}
.gate-icon{font-size:40px;text-align:center;margin-bottom:1rem;color:var(--teal)}
.chklist{list-style:none;margin:1rem 0}
.chklist li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--mid);padding:5px 0;line-height:1.5}
.chklist li i{color:var(--teal);margin-top:1px;flex-shrink:0}
.result-score{font-size:52px;font-weight:600;color:var(--slate);text-align:center;margin-bottom:4px}
.result-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:1rem}
.brow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.brow:last-child{border:none}
.brow-l{color:var(--mid)}
.brow-r{font-weight:600}
.brow-r.good{color:var(--success)}
.brow-r.ok{color:var(--warning)}
.brow-r.low{color:var(--danger)}
.q-rev{background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.q-rev-q{font-size:12px;font-weight:500;color:var(--slate);margin-bottom:4px}
.q-rev-a{font-size:12px;color:var(--mid);line-height:1.5}
.q-rev-a.c{color:var(--success)}
.q-rev-a.w{color:var(--danger)}
.integrity-box{background:var(--danger-bg);border:1px solid #f09595;border-left:4px solid var(--danger);border-radius:8px;padding:14px;margin-bottom:1rem}
.integrity-box p{font-size:13px;color:var(--danger);line-height:1.6}
.warn-banner{background:var(--warning-bg);border:1px solid #FAC775;border-left:4px solid var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--warning);display:none}
.warn-banner.show{display:block}
.sec-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin:1.25rem 0 0.75rem;padding-bottom:6px;border-bottom:1px solid var(--border)}
.preview-vid{width:220px;height:165px;border-radius:10px;border:2px solid var(--teal);background:#000;display:block;margin:0 auto 12px;object-fit:cover}
h2.page-title{font-size:20px;font-weight:600;color:var(--slate);margin-bottom:6px}
.page-sub{font-size:13px;color:var(--mid);line-height:1.6}
.info-row{display:flex;gap:8px;flex-wrap:wrap;margin:1rem 0}
.info-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mid);background:var(--gray);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
</style>
</head>
<body>
<div id="wrap">
  <div class="logo">
    <img src="/images/logo-dark.png" alt="GoLive Digital Solutions" style="height:120px;object-fit:contain">
  </div>
  <div id="app"></div>
</div>

<script>
const QUESTIONS=[
  {id:'q1',sec:'Section A — DNS & domains',type:'mcq',
   text:'A client\'s website is showing a "domain not found" error after they transferred their domain to GoLive Naija. The domain was transferred yesterday. What is the most likely cause?',
   opts:['GoLive\'s server is down','DNS propagation has not completed yet — this can take up to 48 hours','The client needs to buy the domain again','The website files need to be re-uploaded'],
   correct:1,explain:'DNS propagation after a domain transfer can take 24–48 hours globally. This is normal and the client should be reassured, not panicked.'},
  {id:'q2',sec:'Section A — DNS & domains',type:'mcq',
   text:'A client wants their email to route to Google Workspace. Which DNS record type do you need to update?',
   opts:['A record','CNAME record','MX record','TXT record'],
   correct:2,explain:'MX (Mail Exchange) records control where email for a domain is delivered. Changing MX records to point to Google\'s mail servers routes email to Google Workspace.'},
  {id:'q3',sec:'Section A — DNS & domains',type:'tf',
   text:'An A record maps a domain name to an IPv4 address.',
   correct:'True',explain:'An A record (Address record) maps a hostname to its IPv4 address. This is how domain names resolve to the server\'s IP address.'},
  {id:'q4',sec:'Section A — DNS & domains',type:'mcq',
   text:'A client asks why their website is showing as "Not Secure" in the browser. What is the most likely cause?',
   opts:['Their internet connection is slow','Their SSL certificate has expired or is not installed','Their website has too many images','Their hosting plan has expired'],
   correct:1,explain:'A "Not Secure" warning in browsers means the site is either not using HTTPS or the SSL certificate is missing, expired, or incorrectly configured.'},
  {id:'q5',sec:'Section A — DNS & domains',type:'mcq',
   text:'What does TTL stand for in DNS, and what does it control?',
   opts:['Total Transfer Limit — controls file upload sizes','Time To Live — controls how long DNS records are cached before being refreshed','Transfer Time Limit — controls how long domain transfers take','Traffic Threshold Level — controls server load'],
   correct:1,explain:'TTL (Time To Live) is the duration in seconds that a DNS record is cached by resolvers. Lower TTL means changes propagate faster but increase DNS query load.'},
  {id:'q6',sec:'Section B — Hosting & cPanel',type:'mcq',
   text:'A client calls saying their website loads very slowly. After checking, you see the server CPU is at 95%. What is your immediate first step?',
   opts:['Tell the client to restart their computer','Identify which processes or scripts are consuming the most CPU using the server\'s resource monitor, then escalate to senior technical staff','Immediately migrate the client to a new server without investigation','Increase the client\'s hosting plan without investigating the cause'],
   correct:1,explain:'Diagnose before acting. Identify the specific process causing the spike — it could be a rogue plugin, a traffic surge, or a malware script. Document findings before escalating.'},
  {id:'q7',sec:'Section B — Hosting & cPanel',type:'mcq',
   text:'A client wants to create a new email address using their domain (e.g. info@theircompany.com). Where in cPanel do you set this up?',
   opts:['File Manager','Email Accounts','MySQL Databases','Softaculous Apps Installer'],
   correct:1,explain:'Email Accounts in cPanel is where you create, manage, and configure email addresses for a domain hosted on the server.'},
  {id:'q8',sec:'Section B — Hosting & cPanel',type:'tf',
   text:'If a client\'s hosting account is suspended for non-payment, their website and email stop working immediately.',
   correct:'True',explain:'A suspended hosting account takes all associated services offline — website, email, databases, and subdomains — until the account is reactivated after payment.'},
  {id:'q9',sec:'Section B — Hosting & cPanel',type:'mcq',
   text:'A client reports that their website was working yesterday but now shows a blank white page. What are the first two things you check?',
   opts:['Check if the domain has expired, then check error logs for PHP or application errors','Reinstall the website from scratch','Call the client back and tell them to wait 24 hours','Increase the server RAM immediately'],
   correct:0,explain:'A blank white page (White Screen of Death) in web hosting is typically caused by a PHP error or a failed plugin/theme update. Error logs reveal the exact cause quickly.'},
  {id:'q10',sec:'Section C — Customer support',type:'text',
   text:'A client submits a ticket at 2am saying their business email is not working and they are losing customers. Write a professional support response acknowledging the issue and setting expectations.',
   sub:'Be empathetic, clear about next steps, and professional. Do not over-promise resolution time.',
   placeholder:'Dear [Client name]...'},
  {id:'q11',sec:'Section C — Customer support',type:'text',
   text:'You are ending your day shift and handing over to the night shift technician. Write a brief handover note covering: 2 open tickets, a scheduled maintenance window at 11pm, and a client who called twice about a slow website.',
   sub:'Be concise and structured so the night shift technician has everything they need.',
   placeholder:'Handover note — [Date]...'},
  {id:'q12',sec:'Section D — Judgement',type:'mcq',
   text:'During your shift a server monitoring alert fires showing disk usage at 98% on a shared hosting server. You are not authorised to delete files without approval. What do you do?',
   opts:['Ignore it — 98% is not 100%','Immediately escalate to your senior technician and document the alert with timestamp, server name, and disk usage figure','Delete the largest files you can find to free up space','Restart the server to clear cache'],
   correct:1,explain:'Disk usage at 98% is a critical alert — at 100% the server stops functioning. Escalate immediately with full documentation. Do not take unauthorised action on shared hosting servers.'},
  {id:'q13',sec:'Section D — Judgement',type:'mcq',
   text:'A client calls and claims their account was hacked and demands you reset their password immediately over the phone. What do you do?',
   opts:['Reset the password immediately to help the client','Verify the caller\'s identity against account records first, then follow the official password reset procedure — never reset based on an unverified phone call','Tell them to submit a ticket and hang up','Give them the current password so they can log in'],
   correct:1,explain:'Social engineering attacks often come as urgent password reset requests. Always verify identity against account records before any security action. An unverified phone request should never trigger a password reset.'},
  {id:'q14',sec:'Section D — Judgement',type:'tf',
   text:'If a client\'s website is hacked and contains malware, your first action should be to take the site offline immediately to prevent the malware from spreading to other hosted sites.',
   correct:'True',explain:'Malware on shared hosting can spread to other accounts on the same server. Isolating the compromised site immediately is the correct first step, followed by investigation, cleaning, and notification.'},
  {id:'q15',sec:'Section E — Reasoning',type:'mcq',
   text:'GoLive Naija runs 24-hour hosting support across a day shift (8am–8pm) and night shift (8pm–6am). A client submits a critical ticket at 7:45pm. You are the day shift technician with 15 minutes left. What do you do?',
   opts:['Log off at 8pm — it is not your problem after your shift ends','Immediately start working the ticket, brief the incoming night shift technician on its status before you leave, and ensure it is marked as in-progress','Tell the client to wait until tomorrow morning','Only look at the ticket if it takes less than 15 minutes to fix'],
   correct:1,explain:'A critical ticket 15 minutes before shift end must be triaged and handed over — not ignored. Start it, document what you have done, and give the night shift technician a clear brief. Client continuity is the priority.'},
]

const ROLE={name:"Hosting Support Technician",heading:"Hosting Support Technician",intro:"Hosting Support Technician assessment."}
</script>
<script src="/assessment-core.js?v=1"></script>
</body>
</html>
