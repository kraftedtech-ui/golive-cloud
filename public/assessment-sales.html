<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoLive — Sales &amp; Support Associate Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-lt:#E1F5EE;--teal-mid:#9FE1CB;
  --navy:#0D2233;--amber:#B85042;--amber-lt:#FFF8F6;
  --slate:#1E293B;--mid:#475569;--muted:#94A3B8;
  --gray:#F4F7FB;--border:#E2E8F0;--white:#FFFFFF;
  --success-bg:#EAF3DE;--success:#3B6D11;
  --danger-bg:#FCEBEB;--danger:#A32D2D;
  --warning-bg:#FAEEDA;--warning:#854F0B;
  --accent-bg:#E6F1FB;--accent:#185FA5;
}
body{font-family:'Inter',sans-serif;background:#F8FAFC;color:var(--slate);min-height:100vh;padding:0}
#wrap{max-width:660px;margin:0 auto;padding:2rem 1rem 4rem}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:2rem}
.logo-mark{width:36px;height:36px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600}
.logo-text{font-size:14px;font-weight:500;color:var(--slate)}
.logo-sub{font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1rem}
.badge{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.ba{background:var(--accent-bg);color:var(--accent)}
.bs{background:var(--success-bg);color:var(--success)}
.bd{background:var(--danger-bg);color:var(--danger)}
.bw{background:var(--warning-bg);color:var(--warning)}
.hbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.25rem}
.timer-box{display:flex;align-items:center;gap:8px;background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:7px 12px}
.timer-val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--slate)}
.timer-val.warn{color:var(--warning)}
.timer-val.danger{color:var(--danger)}
.cam-wrap{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cam-box{width:150px;height:112px;border-radius:10px;overflow:hidden;border:2px solid var(--teal);background:#000;position:relative;box-shadow:0 4px 16px rgba(0,0,0,0.2)}
.cam-box video{width:100%;height:100%;object-fit:cover}
.cam-rec{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:#e53535;animation:blink 1s infinite}
.cam-lbl{font-size:10px;color:var(--muted)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.prog{height:3px;background:var(--gray);border-radius:2px;margin-bottom:1.25rem}
.prog-fill{height:100%;background:var(--teal);border-radius:2px;transition:width 0.3s}
.q-text{font-size:15px;font-weight:500;color:var(--slate);line-height:1.65;margin-bottom:6px}
.q-sub{font-size:12px;color:var(--mid);line-height:1.6;margin-bottom:1rem}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:8px;cursor:pointer;margin-bottom:7px;background:#fff;transition:all 0.12s;user-select:none}
.opt:hover{border-color:var(--teal);background:var(--teal-lt)}
.opt.sel{border-color:var(--teal);background:var(--teal-lt)}
.opt input{margin-top:2px;flex-shrink:0;accent-color:var(--teal)}
.opt-text{font-size:13px;color:var(--slate);line-height:1.5}
textarea{width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--slate);background:#fff;resize:vertical;font-family:'Inter',sans-serif;line-height:1.5}
textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,110,86,0.1)}
.tf-row{display:flex;gap:8px}
.tf-btn{flex:1;padding:11px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;background:#fff;color:var(--slate);transition:all 0.12s;font-family:'Inter',sans-serif}
.tf-btn:hover{border-color:var(--teal);background:var(--teal-lt)}
.tf-btn.sel{border-color:var(--teal);background:var(--teal-lt);color:var(--teal)}
.nav{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;border-top:1px solid var(--border);margin-top:1.25rem}
button{padding:9px 18px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;font-weight:500;background:#fff;color:var(--slate);transition:all 0.12s}
button:hover{background:var(--gray)}
button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
button.primary:hover{background:#0a5a45}
button:disabled{opacity:0.35;cursor:not-allowed}
.err{font-size:12px;color:var(--danger);margin-top:6px;min-height:18px}
.vlog{max-height:120px;overflow-y:auto;background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11px;font-family:monospace;color:var(--mid);line-height:1.7}
.gate-icon{font-size:40px;text-align:center;margin-bottom:1rem;color:var(--teal)}
.chklist{list-style:none;margin:1rem 0}
.chklist li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--mid);padding:5px 0;line-height:1.5}
.chklist li i{color:var(--teal);margin-top:1px;flex-shrink:0}
.result-score{font-size:52px;font-weight:600;color:var(--slate);text-align:center;margin-bottom:4px}
.result-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:1rem}
.brow{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.brow:last-child{border:none}
.brow-l{color:var(--mid)}
.brow-r{font-weight:600}
.brow-r.good{color:var(--success)}
.brow-r.ok{color:var(--warning)}
.brow-r.low{color:var(--danger)}
.q-rev{background:var(--gray);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.q-rev-q{font-size:12px;font-weight:500;color:var(--slate);margin-bottom:4px}
.q-rev-a{font-size:12px;color:var(--mid);line-height:1.5}
.q-rev-a.c{color:var(--success)}
.q-rev-a.w{color:var(--danger)}
.integrity-box{background:var(--danger-bg);border:1px solid #f09595;border-left:4px solid var(--danger);border-radius:8px;padding:14px;margin-bottom:1rem}
.integrity-box p{font-size:13px;color:var(--danger);line-height:1.6}
.warn-banner{background:var(--warning-bg);border:1px solid #FAC775;border-left:4px solid var(--amber);border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;color:var(--warning);display:none}
.warn-banner.show{display:block}
.sec-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin:1.25rem 0 0.75rem;padding-bottom:6px;border-bottom:1px solid var(--border)}
.preview-vid{width:220px;height:165px;border-radius:10px;border:2px solid var(--teal);background:#000;display:block;margin:0 auto 12px;object-fit:cover}
h2.page-title{font-size:20px;font-weight:600;color:var(--slate);margin-bottom:6px}
.page-sub{font-size:13px;color:var(--mid);line-height:1.6}
.info-row{display:flex;gap:8px;flex-wrap:wrap;margin:1rem 0}
.info-pill{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mid);background:var(--gray);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
</style>
</head>
<body>
<div id="wrap">
  <div class="logo">
    <img src="/images/logo-dark.png" alt="GoLive Digital Solutions" style="height:120px;object-fit:contain">
  </div>
  <div id="app"></div>
</div>

<script>
const QUESTIONS=[
  {id:'q1',sec:'Section A — Microsoft 365 product knowledge',type:'mcq',
   text:'A client currently uses Gmail and Google Drive for their 5-person team. They want to switch to Microsoft 365. Which plan would you recommend as the starting point and why?',
   opts:['Microsoft 365 Business Premium — it is the most comprehensive plan','Microsoft 365 Business Basic — it provides Exchange Online email, Teams, SharePoint, and OneDrive at the lowest cost, suitable for a small team starting out','Microsoft 365 F1 — it is the cheapest plan available','Microsoft 365 Apps for Business — it includes the desktop Office apps without email'],
   correct:1,explain:'Business Basic is the correct entry point for a small team migrating from Google — it covers email, Teams, SharePoint, and OneDrive at the lowest cost. Premium adds security features that are justified at higher risk profiles or larger organisations.'},
  {id:'q2',sec:'Section A — Microsoft 365 product knowledge',type:'mcq',
   text:'A client asks: "What is Microsoft Teams and do I need it if I already use WhatsApp for team communication?" How do you respond?',
   opts:['Tell them Teams and WhatsApp are the same thing','Explain that Teams is a professional collaboration platform that integrates with their Microsoft 365 files, meetings, and email — giving them searchable history, file sharing, and video calls in one secure place that WhatsApp cannot offer for business','Tell them Teams is only for video calls','Tell them WhatsApp is better and they should keep using it'],
   correct:1,explain:'The correct response positions Teams\'s business value — integration, searchability, security, and compliance — versus WhatsApp\'s limitations for professional use.'},
  {id:'q3',sec:'Section A — Microsoft 365 product knowledge',type:'tf',
   text:'A Microsoft 365 Business Basic licence includes the full desktop versions of Word, Excel, and PowerPoint installed on the user\'s computer.',
   correct:'False',explain:'Business Basic is web and mobile only — it does not include the installed desktop Office applications. Business Standard and above include the full desktop apps.'},
  {id:'q4',sec:'Section A — Microsoft 365 product knowledge',type:'mcq',
   text:'A client has 12 staff members. They want Microsoft 365 Business Standard. As a CSP, GoLive purchases at the distributor price and sells to the client. What is your role in provisioning their licences?',
   opts:['The client must buy directly from Microsoft','GoLive orders the licences through the distributor (4Sight/Pax8), provisions them in the client\'s tenant, and invoices the client at the agreed reseller price','GoLive has no role — the distributor deals with the client directly','The client buys the licences and GoLive installs them for free'],
   correct:1,explain:'As a CSP Indirect Reseller, GoLive orders from the distributor, provisions the licences in the client tenant, and manages the ongoing relationship. This is the core of the CSP business model.'},
  {id:'q5',sec:'Section A — Microsoft 365 product knowledge',type:'mcq',
   text:'A client asks what happens to their data if they stop paying for Microsoft 365. What do you tell them?',
   opts:['Their data is deleted immediately when payment stops','Microsoft keeps their data for 90 days after subscription expiry in a disabled state before permanent deletion — they can export or reactivate within that window','Their data is transferred to a free OneDrive account automatically','Nothing happens — they can access everything indefinitely'],
   correct:1,explain:'Microsoft retains data for 90 days in a disabled state after subscription lapse. This grace period allows recovery but clients should be advised to export data if they plan to leave.'},
  {id:'q6',sec:'Section B — Sales process',type:'mcq',
   text:'A prospect says: "Microsoft 365 is too expensive for our small business." How do you respond?',
   opts:['Agree with them and suggest they try a free alternative','Immediately offer a discount','Break down the per-user monthly cost (as low as $6/user/month for Business Basic) against what they currently spend on separate email, storage, and communication tools — showing the consolidated value','Tell them to come back when they have more budget'],
   correct:2,explain:'The correct response reframes cost as value and uses the price breakdown to show M365\'s total cost is often lower than the sum of separate tools the client is already paying for.'},
  {id:'q7',sec:'Section B — Sales process',type:'mcq',
   text:'You sent a proposal to a prospect 5 days ago and have not heard back. What do you do?',
   opts:['Wait another 2 weeks before following up','Send one polite follow-up email referencing the proposal, asking if they have questions and offering a brief call to walk through it','Call them every day until they respond','Mark the lead as lost and move on'],
   correct:1,explain:'One timely, value-added follow-up is the correct approach. Reference the proposal specifically, offer to help with questions, and keep it brief. Multiple daily calls are intrusive and damage the relationship.'},
  {id:'q8',sec:'Section B — Sales process',type:'tf',
   text:'Once a client has signed up for Microsoft 365 through GoLive, your involvement with that client ends — the distributor handles everything from that point.',
   correct:'False',explain:'As the CSP reseller, GoLive owns the ongoing client relationship — renewals, support escalations, licence changes, and upsell conversations. The distributor handles backend provisioning, not the client relationship.'},
  {id:'q9',sec:'Section B — Sales process',type:'mcq',
   text:'A current GoLive Microsoft 365 client emails saying they want to reduce their licences from 20 to 8 because they made redundancies. What is your first step?',
   opts:['Reduce the licences immediately without asking any questions','Acknowledge the request, check whether they are on an annual or monthly commitment (annual commitments cannot reduce mid-term — seats can only be added, not removed), then advise accordingly','Tell them they cannot reduce licences under any circumstances','Immediately cancel their entire subscription'],
   correct:1,explain:'Annual NCE commitments allow adding licences but not reducing them mid-term. You must check the commitment type first before advising the client — giving wrong information could cause a billing dispute.'},
  {id:'q10',sec:'Section C — Communication',type:'text',
   text:'A prospect contacted GoLive via the website enquiry form asking about Microsoft 365 for their 15-person logistics company. Write a professional first-response email introducing GoLive and asking 2–3 qualifying questions.',
   sub:'Be warm, professional, and concise. Position GoLive credibly without overwhelming them with information.',
   placeholder:'Dear [Name]...'},
  {id:'q11',sec:'Section C — Communication',type:'text',
   text:'A client is unhappy because their Microsoft 365 email setup took 3 days longer than the 2-day turnaround you quoted them. They are threatening to cancel. Write a short email response.',
   sub:'Acknowledge the issue, take responsibility where appropriate, and focus on resolution rather than excuses.',
   placeholder:'Dear [Client name]...'},
  {id:'q12',sec:'Section D — Judgement',type:'mcq',
   text:'During a discovery call a prospect mentions they handle sensitive medical records for a hospital. Which Microsoft 365 plan feature becomes particularly important to highlight?',
   opts:['The lower price of Business Basic','The compliance and data protection features in Business Premium — specifically Microsoft Purview for data governance and Defender for Business for security','The number of free Teams backgrounds','The storage size of OneDrive'],
   correct:1,explain:'Healthcare clients handling sensitive data need to hear about compliance, security, and data governance — not price. Business Premium\'s advanced compliance features (Purview, Defender) are directly relevant to their regulatory obligations.'},
  {id:'q13',sec:'Section D — Judgement',type:'mcq',
   text:'A prospect tells you a competitor is offering Microsoft 365 at a significantly lower price than GoLive. How do you respond?',
   opts:['Immediately match the price without asking any questions','Ask what is included in the competitor\'s price, then clearly differentiate GoLive\'s value — local support, onboarding assistance, ongoing account management, and GoLive\'s CSP credentials','Tell them the competitor\'s offering is probably fake','Give up and mark the lead as lost'],
   correct:1,explain:'Understand the competitor\'s offer first, then differentiate on value rather than competing on price alone. GoLive\'s local presence, proper onboarding, and ongoing support are genuine differentiators in the Nigerian market.'},
  {id:'q14',sec:'Section D — Judgement',type:'tf',
   text:'It is acceptable to verbally commit to a price or service level with a client before checking with the MD, as long as you follow up in writing afterwards.',
   correct:'False',explain:'Verbal commitments are legally binding. Never promise a price or service level without confirming it is approved. If uncertain, tell the client you will confirm within a short timeframe — then get approval before committing.'},
  {id:'q15',sec:'Section E — Reasoning',type:'mcq',
   text:'You have three active leads in your pipeline: Lead A needs a callback today, Lead B submitted a proposal request an hour ago, Lead C has not responded to two follow-up emails in two weeks. How do you prioritise your next 2 hours?',
   opts:['Work on Lead C first since they have been waiting the longest','Call Lead A immediately (committed deadline), then respond to Lead B\'s proposal request (fresh interest, highest conversion probability), then make a final follow-up decision on Lead C','Work on Lead B first since they just came in','Archive Lead C and focus only on A and B'],
   correct:1,explain:'Lead A has a committed deadline — that is non-negotiable. Lead B has fresh intent and high conversion probability. Lead C has shown low engagement and should be assessed for a final follow-up or archiving, but only after the higher-priority tasks.'},
]

const ROLE={name:"Sales & Support Associate",heading:"Sales &amp; Support Associate",intro:"Sales &amp; Support Associate assessment."}
</script>
<script src="/assessment-core.js?v=1"></script>
</body>
</html>
